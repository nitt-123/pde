        /* Custom styles */
        body {
            font-family: 'Inter', sans-serif;
        }
        .week-button.selected {
            background-color: #1d4ed8; /* Darker blue */
            color: white;
        }
        input[type="radio"] {
            margin-right: 0.5rem;
        }
        /* Add specific styling for the labels containing radios */
        .option-label {
             display: flex; /* Use flex to align radio and text */
             align-items: center; /* Vertically center items */
             padding: 0.75rem; /* p-3 */
             border: 1px solid #d1d5db; /* border-gray-300 */
             border-radius: 0.375rem; /* rounded-md */
             margin-bottom: 0.75rem; /* space-y-3 equivalent */
             cursor: pointer;
             transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }
        .option-label:hover {
            background-color: #f3f4f6; /* hover:bg-gray-100 */
        }
        .option-label.selected {
             border-color: #3b82f6; /* border-blue-500 */
             background-color: #eff6ff; /* bg-blue-50 */
        }
         .option-label.correct {
            border-color: #16a34a; /* border-green-500 */
            background-color: #f0fdf4; /* bg-green-50 */
        }
        .option-label.incorrect {
            border-color: #dc2626; /* border-red-600 */
            background-color: #fef2f2; /* bg-red-50 */
        }
        /* Style for the feedback text */
        #feedback.correct {
            color: #15803d; /* text-green-700 */
            font-weight: 600; /* font-semibold */
        }
        #feedback.incorrect {
            color: #b91c1c; /* text-red-700 */
            font-weight: 600; /* font-semibold */
        }
        /* Ensure buttons have good touch target size */
        .nav-button, .week-button, #submit-button {
            padding: 0.75rem 1.5rem; /* p-3 equivalent */
            margin: 0.5rem; /* m-2 equivalent */
            border-radius: 0.375rem; /* rounded-md */
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        /* Disable pointer events on options after selection */
        .options-disabled .option-label {
            pointer-events: none;
            opacity: 0.8;
        }

    </style>

        // Generate week selection buttons
        function generateWeekButtons() {
            weekButtonsContainer.innerHTML = '';
            Object.keys(quizData).forEach(weekNum => {
                const button = document.createElement('button');
                button.textContent = `Week ${weekNum}`;
                button.classList.add('week-button', 'bg-blue-500', 'hover:bg-blue-600', 'text-white', 'font-medium', 'py-2', 'px-4', 'rounded-md', 'm-1', 'transition', 'duration-150', 'ease-in-out');
                button.dataset.week = weekNum;
                button.addEventListener('click', () => selectWeek(weekNum));
                weekButtonsContainer.appendChild(button);
            });
        }

            currentWeek = weekNum;
            weeklyQuestions = quizData[weekNum];

            resultsAreaDiv.classList.add('hidden');
            quizAreaDiv.classList.remove('hidden');

            document.querySelectorAll('.week-button').forEach(btn => {
                btn.classList.toggle('selected', btn.dataset.week === weekNum);
                btn.classList.toggle('bg-blue-700', btn.dataset.week === weekNum);
            });

            loadQuestion();
        }

        // Load the current question and options
        function loadQuestion() {
            feedbackDiv.textContent = ''; // Clear feedback
            feedbackDiv.className = 'mt-4 text-sm font-medium h-6'; // Reset feedback class
            optionsContainerDiv.classList.remove('options-disabled'); // Re-enable options container

            const questionData = weeklyQuestions[currentQuestionIndex];
            questionTextP.textContent = `${currentQuestionIndex + 1}. ${questionData.question}`;
            optionsContainerDiv.innerHTML = ''; // Clear previous options

            questionData.options.forEach((option, index) => {
                const label = document.createElement('label');
                label.classList.add('option-label'); // Use the specific class for styling
                label.dataset.index = index; // Store index on the label

                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `question${currentQuestionIndex}`;
                radio.value = index;
                radio.classList.add('mr-3', 'form-radio', 'h-5', 'w-5', 'text-blue-600', 'focus:ring-blue-500');

                // If an answer was previously selected for this question (e.g., using Prev button)
                if (userAnswers[currentQuestionIndex] !== null) {
                     radio.checked = (userAnswers[currentQuestionIndex] === index);
                     // Show feedback immediately if navigating back to an answered question
                     showFeedback(userAnswers[currentQuestionIndex]);
                } else {
                    // Only add change listener if the question hasn't been answered yet
                     radio.addEventListener('change', handleAnswerSelection);
                }


                label.appendChild(radio);
                label.appendChild(document.createTextNode(option));
                optionsContainerDiv.appendChild(label);
            });

            updateNavigation();
        }

        // Handle the user selecting an answer
        function handleAnswerSelection(event) {
             const selectedIndex = parseInt(event.target.value);
             userAnswers[currentQuestionIndex] = selectedIndex; // Store user's selection
             showFeedback(selectedIndex); // Show correct/incorrect feedback
        }

        // Show feedback for the selected answer
         function showFeedback(selectedIndex) {
            const questionData = weeklyQuestions[currentQuestionIndex];
            const correctIndex = questionData.correctAnswer;
            const isCorrect = selectedIndex === correctIndex;

            // Add 'options-disabled' class to prevent further clicks
            optionsContainerDiv.classList.add('options-disabled');

            // Update feedback text and style
            feedbackDiv.textContent = isCorrect ? 'Correct!' : 'Incorrect!';
            feedbackDiv.className = `mt-4 text-sm font-medium h-6 ${isCorrect ? 'correct' : 'incorrect'}`; // Add correct/incorrect class

            // Style the labels
            const labels = optionsContainerDiv.querySelectorAll('.option-label');
            labels.forEach(label => {
                const labelIndex = parseInt(label.dataset.index);
                 // Highlight the correct answer in green
                if (labelIndex === correctIndex) {
                    label.classList.add('correct');
                }
                // Highlight the selected answer (red if incorrect, green if correct)
                if (labelIndex === selectedIndex) {
                     label.classList.add(isCorrect ? 'correct' : 'incorrect');
                     // Ensure the radio button itself reflects the selection visually
                     label.querySelector('input[type="radio"]').checked = true;
                }
                 // Disable radio buttons directly as well
                 label.querySelector('input[type="radio"]').disabled = true;
            });


            // Update score if the answer was correct and hasn't been scored yet
            // (This check prevents adding score multiple times if user goes back and forth)
            if (isCorrect && !questionData.scored) {
                 score++;
                 questionData.scored = true; // Mark question as scored
            } else if (!isCorrect) {
                 // If user changes answer from correct to incorrect via Prev/Next
                 if (questionData.scored) {
                     score--; // Decrement score if it was previously correct
                     questionData.scored = false; // Reset scored status
                 }
            }


            // Enable the Next button or Submit button
             nextButton.disabled = false;
             if (currentQuestionIndex === weeklyQuestions.length - 1) {
                submitButton.disabled = false;
            }
        }


        // Update navigation buttons and counter
        function updateNavigation() {
            questionCounterSpan.textContent = `Question ${currentQuestionIndex + 1} of ${weeklyQuestions.length}`;
            prevButton.disabled = currentQuestionIndex === 0;

            // Next button is disabled initially, enabled when an answer is selected
            // Submit button is shown/enabled only on the last question AFTER it's answered
            const isLastQuestion = currentQuestionIndex === weeklyQuestions.length - 1;
            const isAnswered = userAnswers[currentQuestionIndex] !== null;

            nextButton.disabled = !isAnswered || isLastQuestion; // Disabled if not answered OR if last question
            nextButton.classList.toggle('hidden', isLastQuestion); // Hide Next on last question

            submitButton.classList.toggle('hidden', !isLastQuestion); // Show Submit only on last question
            submitButton.disabled = !isAnswered; // Enable Submit only after last question is answered

        }

        // Go to the previous question
        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                // Reset scored status for current question before moving back,
                // allowing score to be decremented if user changes answer later.
                // weeklyQuestions[currentQuestionIndex].scored = false; // Optional: Reset score status on prev? Decide based on desired logic.

                currentQuestionIndex--;
                loadQuestion();
            }
        }

        // Go to the next question
        function nextQuestion() {
            // The check for answered question is now handled by enabling the button in showFeedback
            if (currentQuestionIndex < weeklyQuestions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            }
        }

        // Submit the quiz (called from Submit button)
        function submitQuiz() {
            // Score is already calculated incrementally
            quizAreaDiv.classList.add('hidden');
            resultsAreaDiv.classList.remove('hidden');
            scoreP.textContent = `Your score: ${score} out of ${weeklyQuestions.length}`;

             // Reset scored status for all questions in the completed week for potential retries
             weeklyQuestions.forEach(q => q.scored = false);
        }

        // Go back to week selection
        function changeWeek() {
            resultsAreaDiv.classList.add('hidden');
            weekSelectionDiv.classList.remove('hidden');
            document.querySelectorAll('.week-button').forEach(btn => {
                btn.classList.remove('selected', 'bg-blue-700');
            });
            currentWeek = null;
        }


        // Restart the current week's quiz
        function restartWeek() {
            if (currentWeek) {
                 // Reset scored status before restarting
                 weeklyQuestions.forEach(q => q.scored = false);
                 selectWeek(currentWeek); // Reload the current week
            }
        }

        // --- Event Listeners ---
        prevButton.addEventListener('click', prevQuestion);
        nextButton.addEventListener('click', nextQuestion);
        submitButton.addEventListener('click', submitQuiz);
        restartWeekButton.addEventListener('click', restartWeek);
        changeWeekButton.addEventListener('click', changeWeek);


        // --- Initial Setup ---
        generateWeekButtons(); // Create week buttons on page load

    </script>

</body>
