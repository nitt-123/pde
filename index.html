<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Design and Manufacturing Quiz</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        select, button {
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid #ddd;
            background-color: white;
            font-size: 16px;
            margin: 5px 0;
        }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        .quiz-container {
            background-color: white;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        .question {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .question-text {
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        @media (max-width: 600px) {
            .options {
                grid-template-columns: 1fr;
            }
        }
        
        .option {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .option:hover {
            background-color: #f0f0f0;
        }
        
        .option.selected {
            background-color: #3498db;
            color: white;
            border-color: #2980b9;
        }
        
        .option.correct {
            background-color: #2ecc71;
            color: white;
            border-color: #27ae60;
        }
        
        .option.incorrect {
            background-color: #e74c3c;
            color: white;
            border-color: #c0392b;
        }
        
        .results {
            text-align: center;
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
        
        .progress {
            margin-top: 20px;
            text-align: center;
            font-size: 16px;
            color: #7f8c8d;
        }
        
        .hidden {
            display: none;
        }
        
        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        .explanation {
            margin-top: 15px;
            padding: 10px;
            background-color: #f8f9fa;
            border-left: 4px solid #3498db;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Product Design and Manufacturing Quiz</h1>
    
    <div class="controls">
        <select id="week-select">
            <option value="">Select a Week</option>
            <option value="1">Week 1</option>
            <option value="2">Week 2</option>
            <option value="3">Week 3</option>
            <option value="4">Week 4</option>
            <option value="5">Week 5</option>
            <option value="6">Week 6</option>
            <option value="7">Week 7</option>
            <option value="8">Week 8</option>
            <option value="9">Week 9</option>
            <option value="10">Week 10</option>
            <option value="11">Week 11</option>
            <option value="12">Week 12</option>
        </select>
        
        <button id="start-btn">Start Quiz</button>
        <button id="check-answers" class="hidden">Check Answers</button>
        <button id="next-btn" class="hidden">Next Question</button>
        <button id="restart-btn" class="hidden">Restart Quiz</button>
    </div>
    
    <div id="quiz-container" class="quiz-container hidden">
        <div id="question-container"></div>
        <div class="progress" id="progress"></div>
        <div class="results hidden" id="results"></div>
    </div>
    
    <script>
        // Quiz data organized by week
        const quizData = {
            "1": [
                {
                    question: "Which of the following process is currently used in product realization process?",
                    options: ["Analytical process", "Creative process", "Problem definition", "All of these"],
                    answer: "All of these",
                    explanation: "All these processes (analytical, creative, and problem definition) are used in product realization."
                },
                {
                    question: "The extended team of designer and developer of the product is limited and remains small to meet in a conference room.",
                    options: ["True", "False"],
                    answer: "False",
                    explanation: "The extended team is not necessarily small and can include many members beyond just designers and developers."
                },
                {
                    question: "What is another term of products in business?",
                    options: ["Services", "Goods", "Merchandise", "Raw materials"],
                    answer: "Goods",
                    explanation: "In business, products are often referred to as goods."
                },
                {
                    question: "______ is defined as the production activity involving production of large quantity of same kind of product for a long period of time.",
                    options: ["Mass production", "Manufacturing capability", "Interchangeability", "Product life cycle"],
                    answer: "Mass production",
                    explanation: "Mass production involves producing large quantities of the same product over an extended period."
                },
                {
                    question: "Analyzing the problem is the initial step in Krick's problem-solving process.",
                    options: ["True", "False"],
                    answer: "False",
                    explanation: "The initial step in Krick's process is problem definition, not analysis."
                },
                {
                    question: "Which of the following is a disadvantage of evolution in product designing?",
                    options: ["Unsuitability for mass production", "Difficulty in modification", "Inability to tap new technologies", "All of these"],
                    answer: "All of these",
                    explanation: "Evolutionary design can have all these disadvantages compared to revolutionary approaches."
                },
                {
                    question: "What is the association between design and manufacturing functions often referred to as?",
                    options: ["Sequential Engineering", "Consecutive Engineering", "Simultaneous Engineering", "Isolated Engineering"],
                    answer: "Simultaneous Engineering",
                    explanation: "The close association between design and manufacturing is called Simultaneous Engineering."
                },
                {
                    question: "______ largely pushes the decision of product development to be made quickly without having detailed information?",
                    options: ["Economics", "Time pressure", "Dynamics", "Trade-off"],
                    answer: "Time pressure",
                    explanation: "Time pressure often forces quick decisions without complete information."
                },
                {
                    question: "Interchangeability ensures that parts can be replaced without any fitting adjustments.",
                    options: ["True", "False"],
                    answer: "True",
                    explanation: "This is the definition of interchangeability in manufacturing."
                },
                {
                    question: "What happens to the existing product when competitive products appear in market during the product life cycle?",
                    options: ["Sales decline", "Profits grows", "Maturity period extends", "Exponential growth"],
                    answer: "Sales decline",
                    explanation: "Competition typically leads to declining sales of the existing product."
                }
            ],
            "2": [
                {
                    question: "A target value for each parameter is set based on its importance and competitor's product.",
                    options: ["True", "False"],
                    answer: "True",
                    explanation: "Target values consider both the parameter's importance and competitor benchmarks."
                },
                {
                    question: "What is the recommended balance for performance specifications while establishing functions in Engineering Design?",
                    options: ["They should not be extremely narrow", "They should be extremely broad", "They should not be narrow nor broad", "None of these"],
                    answer: "They should not be narrow nor broad",
                    explanation: "Performance specifications should be balanced - neither too narrow nor too broad."
                },
                {
                    question: "Which of the following is not an attribute of successful product development?",
                    options: ["Cost", "Value", "Distinctiveness", "Time"],
                    answer: "Time",
                    explanation: "While time is important, it's not typically considered a product attribute like cost, value, or distinctiveness."
                },
                {
                    question: "Operational aspects are often multiple, and usage of the product can be left to the customer's choice.",
                    options: ["True", "False"],
                    answer: "True",
                    explanation: "Products often have multiple operational aspects that customers can choose between."
                },
                {
                    question: "______ is defined as the length of the service life or endurance of the product.",
                    options: ["Quality", "Dependability", "Durability", "None of these"],
                    answer: "Durability",
                    explanation: "Durability refers to how long a product lasts in service."
                },
                {
                    question: "Quality is an attribute that can be defined by two major factors:",
                    options: ["Durability and dependability", "Durability and cost", "Dependability and cost", "Cost and function"],
                    answer: "Durability and dependability",
                    explanation: "Quality is often defined by how long a product lasts (durability) and how reliably it performs (dependability)."
                },
                {
                    question: "A product has certain properties like intrinsic, extrinsic, and physical form.",
                    options: ["True", "False"],
                    answer: "True",
                    explanation: "Products do have these different types of properties."
                },
                {
                    question: "One way of generating performance specification while establishing functions in engineering design is through:",
                    options: ["Scree Plot", "House of Quality", "Design of Experiments", "Gantt chart"],
                    answer: "House of Quality",
                    explanation: "The House of Quality is a key tool in Quality Function Deployment for establishing specifications."
                },
                {
                    question: "After completion of functional analysis in developing provisional designs, one must develop a matrix of sub functions as rows and possible solutions as columns.",
                    options: ["True", "False"],
                    answer: "True",
                    explanation: "This matrix is a common step in design methodology."
                },
                {
                    question: "In Design Thinking, which phase follows 'ideation'?",
                    options: ["Define", "Test", "Prototype", "Empathize"],
                    answer: "Prototype",
                    explanation: "The standard Design Thinking process goes: Empathize, Define, Ideate, Prototype, Test."
                }
            ],
            "3": [
                {
                    question: "Which factor is not mentioned as affecting Aesthetic Design?",
                    options: ["Forms/shapes", "Material strength", "Proportions", "Colors"],
                    answer: "Material strength",
                    explanation: "While material strength is important for function, it's not typically considered an aesthetic factor."
                },
                {
                    question: "Basic elements of visual design are form, content, arrangement, light and color.",
                    options: ["True", "False"],
                    answer: "True",
                    explanation: "These are indeed the fundamental elements of visual design."
                },
                {
                    question: "What is a 'tint' in the context of color?",
                    options: ["A hue with added black", "A hue with added white", "A hue with added complement", "A pure hue without any additions"],
                    answer: "A hue with added white",
                    explanation: "A tint is created by adding white to a base hue."
                },
                {
                    question: "Which type of design utilizes shapes found in nature?",
                    options: ["Geometric", "Natural", "Abstract", "None of these"],
                    answer: "Natural",
                    explanation: "Natural design incorporates organic shapes found in nature."
                },
                {
                    question: "Creating contrast is not a consideration when adjusting size in the perception aspect.",
                    options: ["True", "False"],
                    answer: "False",
                    explanation: "Contrast is an important consideration when working with size in design."
                },
                {
                    question: "Which type of balance is created through a/an axis-point/visual-centre/balance-centre?",
                    options: ["Symmetric balance", "Asymmetric balance", "Radial balance", "None of these"],
                    answer: "Radial balance",
                    explanation: "Radial balance is organized around a central point."
                },
                {
                    question: "______ is a process of creating non-identical instances by adjusting attributes.",
                    options: ["Variation", "Pattern", "Repetition", "None of these"],
                    answer: "Variation",
                    explanation: "Variation involves creating similar but not identical elements."
                },
                {
                    question: "What is the primary goal of emphasis in design?",
                    options: ["Achieving a monochromatic look", "Creating a balance series of emphases", "Using all available colors", "Minimizing contrast"],
                    answer: "Creating a balance series of emphases",
                    explanation: "Emphasis creates focal points while maintaining overall balance."
                },
                {
                    question: "Inclined lines and curves are used to generate a unity concept in the form of shapes of the product.",
                    options: ["True", "False"],
                    answer: "True",
                    explanation: "These design elements can indeed create a sense of unity."
                },
                {
                    question: "What suggests the concept 'NO ART for ART SAKE'?",
                    options: ["Variety", "Function", "Unity", "None of these"],
                    answer: "Function",
                    explanation: "This concept emphasizes that design should prioritize function over pure aesthetics."
                }
            ],
            "11": [
                {
                    question: "What is the primary goal of Computer Integrated Manufacturing (CIM) in manufacturing?",
                    options: ["Lowering cost", "Improving delivery times", "Enhancing quality", "All of these"],
                    answer: "All of these",
                    explanation: "CIM aims to achieve all these benefits simultaneously."
                },
                {
                    question: "Plant layout is the way the equipment is physically arranged in the factory.",
                    options: ["True", "False"],
                    answer: "True",
                    explanation: "This is the definition of plant layout."
                },
                {
                    question: "What is included in the business function of manufacturing support?",
                    options: ["Research and development", "Process planning", "Sales and marketing", "Quality control"],
                    answer: "Process planning",
                    explanation: "Process planning is a core manufacturing support function."
                },
                {
                    question: "Automated machine tools are primarily used for product design in manufacturing.",
                    options: ["True", "False"],
                    answer: "False",
                    explanation: "Automated machine tools are used for production, not design."
                },
                {
                    question: "Which of the following manufacturing industries involve the cultivation and exploitation of natural resources?",
                    options: ["Secondary industries", "Tertiary industries", "Quaternary industries", "Primary industries"],
                    answer: "Primary industries",
                    explanation: "Primary industries deal directly with natural resources."
                },
                {
                    question: "______ involves observing of the product during actual operation or under conditions that might occur during operation.",
                    options: ["Inspection", "Testing", "Product variety", "None of these"],
                    answer: "Testing",
                    explanation: "Testing involves observing products under operational conditions."
                },
                {
                    question: "What does MLT stand for in manufacturing?",
                    options: ["Manufacturing Lead Time", "Machine Learning Time", "Material Loading Time", "Manufacturing Labor Time"],
                    answer: "Manufacturing Lead Time",
                    explanation: "MLT stands for Manufacturing Lead Time, the total time to complete a product."
                },
                {
                    question: "There is a direct relationship between production quantity and product variety in factory operations.",
                    options: ["True", "False"],
                    answer: "False",
                    explanation: "There's typically an inverse relationship - higher quantities usually mean less variety."
                },
                {
                    question: "Which of the following parameters is typically used in mechanical engineering for CAE simulations?",
                    options: ["Temperature", "Pressure", "Component interactions", "All of these"],
                    answer: "All of these",
                    explanation: "CAE simulations can analyze all these mechanical parameters."
                },
                {
                    question: "The set of instructions that controls a machine's actions including speed, feed rate, coolants etc. are called ______.",
                    options: ["M-code", "G-code", "D-code", "N-code"],
                    answer: "G-code",
                    explanation: "G-code is the standard programming language for CNC machines."
                }
            ]
            // Additional weeks can be added here following the same pattern
        };

        // DOM elements
        const weekSelect = document.getElementById('week-select');
        const startBtn = document.getElementById('start-btn');
        const checkAnswersBtn = document.getElementById('check-answers');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const quizContainer = document.getElementById('quiz-container');
        const questionContainer = document.getElementById('question-container');
        const progressElement = document.getElementById('progress');
        const resultsElement = document.getElementById('results');

        // Quiz state variables
        let currentWeek = '';
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = [];

        // Event listeners
        startBtn.addEventListener('click', startQuiz);
        checkAnswersBtn.addEventListener('click', checkAnswers);
        nextBtn.addEventListener('click', nextQuestion);
        restartBtn.addEventListener('click', restartQuiz);

        // Start the quiz
        function startQuiz() {
            currentWeek = weekSelect.value;
            
            if (!currentWeek) {
                alert('Please select a week first!');
                return;
            }
            
            // Get questions for selected week
            currentQuestions = quizData[currentWeek];
            if (!currentQuestions || currentQuestions.length === 0) {
                alert('No questions available for this week yet!');
                return;
            }
            
            // Reset quiz state
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = [];
            
            // Show quiz container and first question
            quizContainer.classList.remove('hidden');
            checkAnswersBtn.classList.remove('hidden');
            nextBtn.classList.add('hidden');
            restartBtn.classList.add('hidden');
            resultsElement.classList.add('hidden');
            
            displayQuestion();
        }

        // Display the current question
        function displayQuestion() {
            const question = currentQuestions[currentQuestionIndex];
            
            // Create question HTML
            let questionHTML = `
                <div class="question">
                    <div class="question-text">${currentQuestionIndex + 1}. ${question.question}</div>
                    <div class="options">
            `;
            
            // Add options
            question.options.forEach((option, index) => {
                const isSelected = userAnswers[currentQuestionIndex] === index;
                questionHTML += `
                    <div class="option ${isSelected ? 'selected' : ''}" data-index="${index}">
                        ${String.fromCharCode(97 + index)}) ${option}
                    </div>
                `;
            });
            
            questionHTML += `
                    </div>
                </div>
            `;
            
            questionContainer.innerHTML = questionHTML;
            
            // Add event listeners to options
            document.querySelectorAll('.option').forEach(option => {
                option.addEventListener('click', selectOption);
            });
            
            // Update progress
            progressElement.textContent = `Question ${currentQuestionIndex + 1} of ${currentQuestions.length}`;
        }

        // Handle option selection
        function selectOption(e) {
            const selectedIndex = parseInt(e.target.getAttribute('data-index'));
            
            // Clear previous selection
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected');
            });
            
            // Mark selected option
            e.target.classList.add('selected');
            
            // Store user's answer
            userAnswers[currentQuestionIndex] = selectedIndex;
        }

        // Check the user's answer
        function checkAnswers() {
            if (typeof userAnswers[currentQuestionIndex] === 'undefined') {
                alert('Please select an answer!');
                return;
            }
            
            const question = currentQuestions[currentQuestionIndex];
            const selectedOptionIndex = userAnswers[currentQuestionIndex];
            const selectedOption = question.options[selectedOptionIndex];
            const isCorrect = selectedOption === question.answer;
            
            // Display correct/incorrect feedback
            document.querySelectorAll('.option').forEach(opt => {
                const optIndex = parseInt(opt.getAttribute('data-index'));
                const optionText = question.options[optIndex];
                
                if (optionText === question.answer) {
                    opt.classList.add('correct');
                } else if (optIndex === selectedOptionIndex) {
                    opt.classList.add('incorrect');
                }
                
                opt.style.pointerEvents = 'none'; // Disable further clicks
            });
            
            // Update score if correct
            if (isCorrect) {
                score++;
            }
            
            // Show explanation
            const explanationHTML = `<div class="explanation"><strong>Explanation:</strong> ${question.explanation}</div>`;
            questionContainer.querySelector('.question').innerHTML += explanationHTML;
            
            // Show appropriate buttons
            checkAnswersBtn.classList.add('hidden');
            
            if (currentQuestionIndex < currentQuestions.length - 1) {
                nextBtn.classList.remove('hidden');
            } else {
                showResults();
            }
        }

        // Move to next question
        function nextQuestion() {
            currentQuestionIndex++;
            nextBtn.classList.add('hidden');
            checkAnswersBtn.classList.remove('hidden');
            displayQuestion();
        }

        // Show final results
        function showResults() {
            restartBtn.classList.remove('hidden');
            resultsElement.classList.remove('hidden');
            resultsElement.textContent = `You scored ${score} out of ${currentQuestions.length} (${Math.round((score / currentQuestions.length) * 100)}%)`;
        }

        // Restart the quiz
        function restartQuiz() {
            startQuiz();
        }
    </script>
</body>
</html>
